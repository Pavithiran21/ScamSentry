# Render Blueprint: one free web service for the API only (Dockerfile.api). The React app is hosted on
# Vercel (Root Directory: frontend); its vercel.json forwards /api/* to this service, so the browser sees
# one origin and the refresh cookie keeps working. Set FRONTEND_URL below to the Vercel URL.
# The database is MongoDB Atlas (free M0) with the database scamsentry_demo. Set the secrets below in
# the Render dashboard, then run once from the service's Shell:
#   npm run seed:demo
# Atlas: allow Render's outbound IPs (or 0.0.0.0/0) under Network Access.
# Free services sleep after 15 minutes without traffic; the first visit then takes about a minute,
# and the in-process purge schedule only runs while the service is awake, so point an external cron
# (e.g. cron-job.org, daily) at POST /api/internal/jobs/purge-report-text with the X-Job-Secret header.
services:
  - type: web
    name: scamsentry-pavithiran
    runtime: docker
    dockerfilePath: ./Dockerfile.api
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: '2' # two hops: Vercel's rewrite, then Render's proxy, so rate limits see the visitor's IP
      - key: LOG_LEVEL
        value: info
      - key: DEMO_MODE
        value: 'true'
      - key: RATE_LIMITS_ENABLED
        value: 'true'
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: JWT_SECRET
        generateValue: true
      - key: INPUT_HASH_SECRET
        generateValue: true
      - key: JOB_TRIGGER_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false # mongodb+srv://…/scamsentry_demo
      - key: FRONTEND_URL
        sync: false # the Vercel URL, https://<project>.vercel.app (CORS and the links in emails)
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEMO_SMTP_HOST
        sync: false
      - key: DEMO_SMTP_PORT
        sync: false
      - key: DEMO_SMTP_USER
        sync: false
      - key: DEMO_SMTP_PASS
        sync: false
      - key: DEMO_SMTP_FROM
        sync: false
